name: 🐛 Bug Report
description: Report something that isn't working as expected.
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below as thoroughly as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area of the App
      description: Which part of SplitLedger is affected?
      options:
        - Dashboard
        - Transactions / Expenses
        - Events
        - Members
        - Discord Integration
        - Stripe / Payments
        - Organization Settings
        - Other
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: e.g. Chrome 125 on Windows 11

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or Logs
      description: Paste any relevant screenshots, error messages, or console output here.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I searched for existing issues and this hasn't been reported yet.
          required: true
        - label: This is not a security vulnerability (I would email security@splitleger.com instead).
          required: true
